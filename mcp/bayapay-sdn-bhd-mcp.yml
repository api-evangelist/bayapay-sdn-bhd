  name: bayapay-site-mcp
  provider: Wix Site MCP
  transport: http
  url: https://www.bayapay.com/_api/mcp
  authentication: none
  notes: >-
    Hosted, site-level Model Context Protocol server automatically provisioned by
    Wix for the bayapay.com site (BayaPay is a Wix-powered site). It exposes only
    public site content and Wix business-solution APIs installed on the site; it is
    NOT a bespoke BayaPay payments API. No authentication is required to connect.
    Advertised in the site llms.txt. See https://dev.wix.com/docs/develop-websites/articles/get-started/about-the-wix-site-mcp
tools:
  - name: GetBusinessDetails
    description: Retrieves business and site details such as timezone, email, phone, and address.
  - name: SearchInSite
    description: Searches the site for information.
  - name: SearchSiteApiDocs
    description: >-
      Retrieves the API documentation for the Wix business solutions installed on this
      site and informs the AI client how to use the APIs.
  - name: GenerateVisitorToken
    description: >-
      Creates a new visitor session and obtains a visitor access token; must be called
      before any CallWixSiteAPI request if no visitor token is available.
  - name: CallWixSiteAPI
    description: >-
      Calls API methods on the site to perform actions on a visitor's behalf, such as
      querying site data, booking an appointment, or starting a purchase.
  - name: ReadFullDocsArticle
    description: Fetches a complete article from the Wix developer documentation portal.
  - name: ReadFullDocsMethodSchema
    description: Fetches the full schema for a Wix API method.
